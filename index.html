<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070B">
<title>TOMZ OS</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<main id="welcome" class="welcome" hidden>
  <div class="panel welcome-card">
    <div class="brand big" role="img" aria-label="TOMZ OS by CodeForge"><span class="logo-wrap"><i class="ring"></i><img class="logo" src="assets/logo.svg" alt="" width="96" height="96"></span><span class="brand-text"><span class="brand-name" aria-hidden="true"><span class="ch" style="--i:0">T</span><span class="ch" style="--i:1">O</span><span class="ch" style="--i:2">M</span><span class="ch" style="--i:3">Z</span><span class="ch sp"></span><span class="ch" style="--i:5">O</span><span class="ch" style="--i:6">S</span></span><small class="by" aria-hidden="true"><span class="by-type"><span>by</span> <b class="forge">Code<em>Forge</em></b></span><i class="spk" style="--x:62%;--dx:6px;--d:3s"></i><i class="spk" style="--x:76%;--dx:-4px;--d:3.5s"></i><i class="spk" style="--x:88%;--dx:8px;--d:4.1s"></i></small></span></div>
    <h1>Welcome</h1>
    <p class="muted">Your tasks, tools and apps in one place. Everything you create stays in this browser.</p>
    <div id="gsiHolder" class="gsi-holder"></div>
    <button id="googleBtn" class="btn primary" type="button">Continue with Google</button>
    <button id="guestBtn" class="btn ghost" type="button">Guest Mode</button>
    <p id="authMsg" class="notice" role="status" hidden></p>
  </div>
</main>

<div id="shell" class="shell" hidden>
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/dashboard" aria-label="TOMZ OS home"><span class="logo-wrap"><i class="ring"></i><img class="logo" src="assets/logo.svg" alt="" width="40" height="40"></span><span class="brand-text"><span class="brand-name" aria-hidden="true"><span class="ch" style="--i:0">T</span><span class="ch" style="--i:1">O</span><span class="ch" style="--i:2">M</span><span class="ch" style="--i:3">Z</span><span class="ch sp"></span><span class="ch" style="--i:5">O</span><span class="ch" style="--i:6">S</span></span><small class="by" aria-hidden="true"><span class="by-type"><span>by</span> <b class="forge">Code<em>Forge</em></b></span><i class="spk" style="--x:62%;--dx:6px;--d:3s"></i><i class="spk" style="--x:76%;--dx:-4px;--d:3.5s"></i><i class="spk" style="--x:88%;--dx:8px;--d:4.1s"></i></small></span></a>
    <nav id="sideNav"></nav>
    <div class="profile">
      <img id="avatar" class="avatar" alt="" hidden>
      <span id="avatarFallback" class="avatar fallback" aria-hidden="true"></span>
      <div class="pname"><strong id="pName"></strong><small id="pMode" class="muted"></small></div>
      <button id="logoutBtn" class="btn small ghost" type="button">Log out</button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <a class="brand mobile-brand" href="#/dashboard"><span class="logo-wrap"><i class="ring"></i><img class="logo" src="assets/logo.svg" alt="" width="32" height="32"></span><span class="brand-text"><span class="brand-name" aria-hidden="true"><span class="ch" style="--i:0">T</span><span class="ch" style="--i:1">O</span><span class="ch" style="--i:2">M</span><span class="ch" style="--i:3">Z</span><span class="ch sp"></span><span class="ch" style="--i:5">O</span><span class="ch" style="--i:6">S</span></span><small class="by" aria-hidden="true"><span class="by-type"><span>by</span> <b class="forge">Code<em>Forge</em></b></span><i class="spk" style="--x:62%;--dx:6px;--d:3s"></i><i class="spk" style="--x:76%;--dx:-4px;--d:3.5s"></i><i class="spk" style="--x:88%;--dx:8px;--d:4.1s"></i></small></span></a>
      <label class="search"><span class="sr">Search apps</span><input id="globalSearch" type="search" placeholder="Search apps  (Ctrl/Cmd + K)" autocomplete="off"></label>
      <div class="top-actions">
        <button id="searchBtn" class="icon-btn" type="button" aria-label="Search everything">&#128269;</button>
        <button id="bellBtn" class="icon-btn" type="button" aria-label="Notifications" aria-expanded="false">&#128276;<b id="bellDot" class="dot" hidden></b></button>
        <a class="icon-btn" href="#/settings" aria-label="Settings">&#9881;</a>
      </div>
      <div id="notifPanel" class="panel pop" hidden role="dialog" aria-label="Notifications"></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav id="bottomNav" class="bottom-nav" aria-label="Mobile navigation"></nav>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
<script src="js/tasks.js"></script>
<script src="js/tools.js"></script>
<script src="js/calculator.js"></script>
<script src="js/password-generator.js"></script>
<script src="js/games.js"></script>
<script src="js/minigames.js"></script>
<script src="js/search.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
